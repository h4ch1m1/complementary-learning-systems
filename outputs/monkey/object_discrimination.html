*{box-sizing:border-box}
[hidden]{display:none!important}
body{max-width:920px;margin:28px auto;padding:0 28px 28px;background:#fff;color:#292929;font:15px/1.6 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,output,svg text{font-family:inherit}
button{font-size:14px;color:inherit;cursor:pointer;border:1px solid #e5e5e5;background:#fff;border-radius:8px;padding:7px 13px;transition:background .15s,box-shadow .15s}
button:hover{background:#f5f5f5}
button:focus-visible,input:focus-visible{outline:2px solid #555;outline-offset:4px}
button:disabled{cursor:default;opacity:1}
.toolbar{display:flex;align-items:center;gap:14px;padding:0 0 20px;margin-bottom:24px;border-bottom:1px solid #ededed}
.toolbar strong{font-size:17px;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.toolbar #mode{margin-left:auto;white-space:nowrap;background:#f4f4f4;border-color:transparent;font-size:13px}
.opponent{position:relative;min-width:0}
#opponent-button{font-size:13px;border-color:transparent;color:#666;text-align:left}
.menu,.weeks{position:absolute;z-index:10;background:#fff;border:1px solid #eee;border-radius:10px;padding:5px;box-shadow:0 8px 28px #00000012}
.menu{top:calc(100% + 8px);left:0;width:152px}
.group{position:relative}
.group>button,.weeks button{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:8px 10px;font-size:13px}
.group>button[aria-expanded=true]{background:#f5f5f5}
.weeks{left:calc(100% + 3px);top:0;width:112px}
.objects{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.object{min-width:0;padding:22px 18px 18px;border:1px solid #eee;border-radius:14px;background:#fff;box-shadow:0 2px 5px #00000003}
.object:not(:disabled):hover{background:#fafafa;border-color:#d5d5d5;box-shadow:0 4px 16px #00000005}
.object.rewarded{border-color:#ced9cd;box-shadow:none}
.object img{display:block;width:100%;height:220px;object-fit:contain;margin:0 auto 22px}
.name{display:block;font-size:16px;font-weight:500}
.reward{display:block;min-height:25px;font-size:12px;color:#888;margin-top:5px}
.reward .food{display:inline-block;width:7px;height:7px;background:#7d967a;border-radius:50%;margin:0 6px 1px 0}
.badges{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;min-height:26px;margin-top:12px}
.badge{font-size:12px;padding:3px 9px;border-radius:5px;background:#ededeb;color:#444}
.badge.model{background:#f4f4f3;color:#666}
.actions{display:flex;justify-content:flex-end;margin:22px 0 0}
.actions button{background:#292929;color:#fff;border-color:#292929;padding:8px 20px}
.actions button:hover{background:#444}
.playback{display:flex;gap:15px;align-items:center;margin:22px 0 0;padding:0 2px}
.playback button{width:32px;height:32px;padding:0;background:#f3f3f3;border-color:transparent;border-radius:50%;font-size:13px}
.playback input{appearance:none;flex:1;min-width:40px;height:4px;border-radius:4px;background:#e5e5e5;cursor:pointer}
.playback input::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#555;border:2px solid white;box-shadow:0 0 0 1px #aaa}
.playback output{font-size:12px;min-width:78px;color:#888;font-variant-numeric:tabular-nums}
.chart{border:0;border-top:1px solid #ededed;margin-top:26px;padding:20px 0 0}
.chart-header{font-size:14px;font-weight:500;color:#444}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 5px}
.legend button{font-size:12px;border:0;padding:4px 9px;color:#777;background:transparent;border-radius:6px}
.legend button:hover,.legend button[aria-pressed=true]{background:#f1f1f1;color:#333}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}
.chart svg{width:100%;height:auto;display:block;max-height:220px}
@media(max-width:500px){body{margin:16px auto;padding:0 16px 20px}.toolbar{flex-wrap:wrap;gap:8px;padding-bottom:16px;margin-bottom:18px}.toolbar strong{font-size:16px}.opponent{order:3;flex-basis:100%}.objects{gap:12px}.object{padding:14px 6px 12px;border-radius:10px}.object img{height:145px;margin-bottom:15px}.name{font-size:14px}.badges{gap:4px}.badge{font-size:11px;padding:3px 6px}.playback{gap:10px}.legend{gap:2px}.legend button{padding:4px 5px}.weeks{position:relative;left:0;width:100%;border:0;box-shadow:none;padding-left:12px}.menu{width:175px}}

renderLearning=function(){originalLearning();$('context').hidden=true;$('context').textContent='';$('explanation').hidden=true;$('explanation').textContent='';$('progress').textContent='';$('progress').hidden=true;$('chart').querySelector('.chart-header span').textContent='Learning curve';$('status').textContent='';$('status').hidden=true;};
const testWithPlayback=enterTest;
enterTest=function(){testWithPlayback();$('status').textContent='';$('status').hidden=true;};
for(let g=0;g<5;g++){const b=document.createElement('button');b.innerHTML=`<i style="background:${colors[g]}"></i>${data.weeks[g]} weeks`;b.title=data.objects[2*g].name+' / '+data.objects[2*g+1].name;b.onclick=()=>{clearTimer();group=g;trial=0;seen[g]=Math.max(seen[g],0);renderLearning();if(playing)timer=setTimeout(advance,200);};$('legend').append(b);}
$('feedback-slider').oninput=()=>{clearTimer();playing=false;const frame=+$('feedback-slider').value;group=Math.floor(frame/15);trial=frame%15;seen[group]=Math.max(seen[group],trial);renderLearning();};
$('play').onclick=()=>{playing=!playing;clearTimer();chart();if(playing)timer=setTimeout(advance,200);};
renderLearning();

</script></body></html>
